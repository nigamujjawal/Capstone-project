apiVersion: v1
kind: ConfigMap
metadata:
  name: cake-delight-config
  namespace: cake-delight
data:
  NODE_ENV: "production"
  MONGO_URI_CATALOG: "mongodb://mongodb-service:27017/catalog_db"
  MONGO_URI_ORDER: "mongodb://mongodb-service:27017/order_db"
  MONGO_URI_RATING: "mongodb://mongodb-service:27017/rating_db"
  MONGO_URI_NOTIFICATION: "mongodb://mongodb-service:27017/notification_db"
  RABBITMQ_URL: "amqp://rabbitmq-service:5672"
  CATALOG_SERVICE_URL: "http://catalog-service:3001"
  ORDER_SERVICE_URL: "http://order-service:3002"
  RATING_SERVICE_URL: "http://rating-service:3003"
  NOTIFICATION_SERVICE_URL: "http://notification-service:3004"
---
apiVersion: v1
kind: Secret
metadata:
  name: cake-delight-secrets
  namespace: cake-delight
type: Opaque
data:
  # Base64 encoded dummy values
  EMAIL_USER: "Y3VzdG9tZXJAc2FtcGxlLmNvbQ=="
  EMAIL_PASS: "c2VjcmV0cGFzc3dvcmQ="
