networks:
  cake-delight-network:
    driver: bridge

volumes:
  mongo_data:
    driver: local
  rabbitmq_data:
    driver: local

services:
  # ==========================================
  # 1. DATABASE: MongoDB Container
  # ==========================================
  mongodb:
    image: mongo:7.0
    container_name: cake-delight-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - cake-delight-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ==========================================
  # 2. MESSAGE BROKER: RabbitMQ Management
  # ==========================================
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: cake-delight-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"     # AMQP Protocol Port
      - "15672:15672"   # Management Web Dashboard Port
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - cake-delight-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ==========================================
  # 3. CATALOG SERVICE
  # ==========================================
  catalog-service:
    build:
      context: ./catalog-service
      dockerfile: Dockerfile
    container_name: cake-delight-catalog
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongodb:27017/catalog_db
    networks:
      - cake-delight-network
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ==========================================
  # 4. ORDER SERVICE
  # ==========================================
  order-service:
    build:
      context: ./order-service
      dockerfile: Dockerfile
    container_name: cake-delight-order
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      - PORT=3002
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongodb:27017/order_db
      - RABBITMQ_URL=amqp://rabbitmq:5672
      - CATALOG_SERVICE_URL=http://catalog-service:3001
    networks:
      - cake-delight-network
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3002/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ==========================================
  # 5. RATING SERVICE
  # ==========================================
  rating-service:
    build:
      context: ./rating-service
      dockerfile: Dockerfile
    container_name: cake-delight-rating
    restart: unless-stopped
    ports:
      - "3003:3003"
    environment:
      - PORT=3003
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongodb:27017/rating_db
    networks:
      - cake-delight-network
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3003/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ==========================================
  # 6. NOTIFICATION SERVICE
  # ==========================================
  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    container_name: cake-delight-notification
    restart: unless-stopped
    ports:
      - "3004:3004"
    environment:
      - PORT=3004
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongodb:27017/notification_db
      - RABBITMQ_URL=amqp://rabbitmq:5672
    networks:
      - cake-delight-network
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3004/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ==========================================
  # 7. API GATEWAY
  # ==========================================
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: cake-delight-gateway
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - CATALOG_SERVICE_URL=http://catalog-service:3001
      - ORDER_SERVICE_URL=http://order-service:3002
      - RATING_SERVICE_URL=http://rating-service:3003
      - NOTIFICATION_SERVICE_URL=http://notification-service:3004
    networks:
      - cake-delight-network
    depends_on:
      catalog-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      rating-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
